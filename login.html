<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduPanel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>EduPanel</h1>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword()">Show</button>
                <div class="checkbox"><input type="checkbox" id="remember"><label for="remember">Remember me</label></div>
                <button type="submit" class="btn">Login</button>
                <div id="errorMessage" class="error-message"></div>
            </form>
            <div class="demo-accounts">
                <button onclick="setDemo('admin@edupanel.bg', 'AdminEdu2026')">Admin</button>
                <button onclick="setDemo('teacher@edupanel.bg', 'TeacherEdu2026')">Teacher</button>
                <button onclick="setDemo('student@edupanel.bg', 'StudentEdu2026')">Student</button>
                <button onclick="setDemo('parent@edupanel.bg', 'ParentEdu2026')">Parent</button>
            </div>
        </div>
    </div>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
