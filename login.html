<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduPanel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">📚</div>
                <h1>EduPanel</h1>
                <p>School Management System</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter email" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                    </div>
                </div>

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                <div id="loginError" class="error-message"></div>
            </form>

            <div class="divider">Demo Accounts</div>

            <div class="demo-buttons">
                <button type="button" onclick="quickLogin('admin@edupanel.bg', 'AdminEdu2026')" class="demo-btn">
                    <span>👨‍💼</span>
                    <span>Director</span>
                </button>
                <button type="button" onclick="quickLogin('teacher@edupanel.bg', 'TeacherEdu2026')" class="demo-btn">
                    <span>👨‍🏫</span>
                    <span>Teacher</span>
                </button>
                <button type="button" onclick="quickLogin('student@edupanel.bg', 'StudentEdu2026')" class="demo-btn">
                    <span>👨‍🎓</span>
                    <span>Student</span>
                </button>
                <button type="button" onclick="quickLogin('parent@edupanel.bg', 'ParentEdu2026')" class="demo-btn">
                    <span>👨‍👩‍👧</span>
                    <span>Parent</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
